[platformio]
default_envs = valve_slave_c3

[env:valve_slave_c3]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = espidf
extra_scripts = pre:tools/mesh_sdk_build.py
upload_port = COM6
monitor_port = COM6
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.sdkconfig_defaults = sdkconfig.defaults
build_flags = -std=gnu++17

; Temporary receive-path diagnosis; does not replace the packaged slave image.
[env:valve_slave_c3_pairing_diag]
extends = env:valve_slave_c3
build_flags = -std=gnu++17 -DPUMP_PAIRING_TRACE=1 -DPUMP_SAR_DIAGNOSTICS=1
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.pairing.defaults
