[platformio]
default_envs = valve_slave_c3

[env:valve_slave_c3]
; 工具链与从节点：ESP32-C3 Super Mini，使用通用 C3 Board 定义。
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = espidf

; 4MB Flash，DIO / 40MHz；应用容量由 partitions.csv 限制。
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L

; 构建前准备项目本地 Mesh SDK 补丁，并生成构建标识。
extra_scripts = pre:tools/mesh_sdk_build.py
build_flags = -std=gnu++17

; ESP-IDF 自动读取 sdkconfig.defaults，已有 sdkconfig.valve_slave_c3 的值优先。
; 修改默认配置时也需同步 sdkconfig.valve_slave_c3，或使用 menuconfig。

; 下载和维护使用板载 USB Serial/JTAG，沿用当前端口 COM6。
; 端口变化时通过 --upload-port / --port 指定实际端口。
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
